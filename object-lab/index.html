<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Threebase Object Lab — real-life objects rebuilt in Three.js." />
    <title>Object Lab · Threebase</title>
    <script type="module" src="../src/main.js"></script>
  </head>
  <body class="collection-page" data-base-path="..">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="../" aria-label="Threebase home">
        <span class="brand__word">Threebase</span>
        <img class="brand__mark" src="../src/assets/enso.png" alt="" width="32" height="32" />
      </a>
      <nav aria-label="Primary navigation">
        <ul class="nav-list">
          <li class="nav-item" data-nav-item>
            <button class="nav-trigger" type="button" aria-expanded="false" aria-controls="playground-menu" data-nav-trigger>
              Playground <span class="nav-trigger__icon" aria-hidden="true"></span>
            </button>
            <div class="nav-menu" id="playground-menu" data-nav-menu hidden>
              <ul class="nav-menu__list" data-playground-menu></ul>
              <a class="nav-menu__all" href="../playground/">View all projects</a>
            </div>
          </li>
          <li class="nav-item" data-nav-item>
            <button class="nav-trigger" type="button" aria-expanded="false" aria-controls="object-lab-menu" data-nav-trigger>
              Object Lab <span class="nav-trigger__icon" aria-hidden="true"></span>
            </button>
            <div class="nav-menu" id="object-lab-menu" data-nav-menu hidden>
              <ul class="nav-menu__list" data-object-menu></ul>
              <a class="nav-menu__all" href="./">View all objects</a>
            </div>
          </li>
        </ul>
      </nav>
    </header>
    <main id="main-content">
      <section class="collection" aria-labelledby="object-lab-title">
        <div class="section-heading">
          <p class="eyebrow">Procedural reconstructions</p>
          <h1 id="object-lab-title">Object Lab</h1>
          <p>Objects from real life rebuilt as inspectable, code-generated Three.js forms.</p>
        </div>
        <div class="entry-grid entry-grid--objects" data-object-list></div>
      </section>
    </main>
    <footer><p><span aria-hidden="true">·</span> Threebase <span aria-hidden="true">·</span></p></footer>
  </body>
</html>
